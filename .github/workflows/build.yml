name: build

on:
  schedule:
    - cron: "30 20 * * *"   # 每天 04:30 CST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 回归测试
        run: python3 tests/test_build.py
      - name: 重新构建
        run: python3 scripts/build.py
      - name: 提交产物
        run: |
          if git diff --quiet -- out/; then
            echo "无变化"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/
          git commit -m "chore: 重建配置 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
